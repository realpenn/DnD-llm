[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-llm"
version = "0.1.0"
description = "Deterministic D&D text campaign engine with an LLM DM facade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Penn", email = "liupeng1502@gmail.com" }]
dependencies = [
    "d20>=1.1.2",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
dnd-llm = "dnd_llm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnd_llm = ["py.typed"]

[tool.setuptools.data-files]
"dnd_llm/rules_data" = ["rules_data/*.json"]
"dnd_llm/rules_data/campaigns/events" = ["rules_data/campaigns/events/*.json"]
"dnd_llm/rules_data/campaigns/starter" = ["rules_data/campaigns/starter/*.json"]
"dnd_llm/rules_data/schemas" = ["rules_data/schemas/*.json"]
"dnd_llm/rules_data/srd/actions" = ["rules_data/srd/actions/*.json"]
"dnd_llm/rules_data/srd/classes" = ["rules_data/srd/classes/*.json"]
"dnd_llm/rules_data/srd/conditions" = ["rules_data/srd/conditions/*.json"]
"dnd_llm/rules_data/srd/hazards" = ["rules_data/srd/hazards/*.json"]
"dnd_llm/rules_data/srd/items" = ["rules_data/srd/items/*.json"]
"dnd_llm/rules_data/srd/monsters" = ["rules_data/srd/monsters/*.json"]
"dnd_llm/rules_data/srd/spells" = ["rules_data/srd/spells/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B009", "B010"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["dnd_llm"]
strict = false
check_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
